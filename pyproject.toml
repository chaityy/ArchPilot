[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archpilot"
version = "0.1.0"
description = "A modern graphical system manager for Arch Linux and its derivatives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "psutil>=6.0"]

[project.scripts]
archpilot = "archpilot.main:main"

[tool.setuptools.packages.find]
include = ["archpilot*"]